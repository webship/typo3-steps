name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

jobs:
  cucumber:
    name: typo3-steps test suite
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'
      DDEV_PROJECT: typo3-intro
      DDEV_SITE_DIR: .typo3-site
      LAUNCH_URL: https://typo3-intro.ddev.site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build the TYPO3 Introduction site with DDEV
        run: |
          mkdir -p "$DDEV_SITE_DIR"
          cd "$DDEV_SITE_DIR"
          bash "$GITHUB_WORKSPACE/scripts/build-site.sh"

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Run typo3-steps test suite against the local DDEV site
        run: npx cucumber-js

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: tests/reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
